[toolchain]
# Pinned 2026-07-26 to the exact nightly this contract has been built and deployed with. Note the
# off-by-one: `rustc +nightly --version` on production reports commit d0babd8b6 (internally dated
# 2026-07-15), but Rust's nightly ARCHIVE is named for the publish date, one day after the commit
# date — verified directly: `rustup toolchain install nightly-2026-07-15` fetches a DIFFERENT commit
# (da80ed070); `nightly-2026-07-16` is the one matching d0babd8b6 exactly. Getting this date wrong
# silently pins a different compiler.
#
# Why pin at all: without it, `cargo +nightly build` floats to whatever nightly happens to be
# installed, which changes upstream daily. This contract uses unstable features directly
# (`core_intrinsics`, `lang_items`) via casper-contract's no_std_handlers — a future nightly can
# change or remove exactly those flags, so an unpinned build is not just non-reproducible, it can
# stop compiling at all with no code change on our side.
channel = "nightly-2026-07-16"
components = ["rust-src"]
targets = ["wasm32-unknown-unknown"]
