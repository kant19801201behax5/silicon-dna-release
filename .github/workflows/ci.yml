name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-ts-agent:
    name: TypeScript Agent Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: casper-agent/ts-agent/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: casper-agent/ts-agent

      - name: Run tests (agent + reputation scorer + verdict log)
        run: npm test
        working-directory: casper-agent/ts-agent

  # Added 2026-07-25. Until now CI covered only ts-agent, so the contract build could sit broken
  # indefinitely — and it was: Cargo.toml's [patch.crates-io] pointed at an absolute path on the
  # maintainer's server, meaning a clean clone could not build at all. This job builds the contract
  # exactly the way README documents it, so that regression cannot come back unnoticed.
  build-contract:
    name: Casper contract builds from a clean clone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly + wasm32 + rust-src
        run: |
          rustup toolchain install nightly --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly
          rustup component add rust-src --toolchain nightly

      - name: Vendor + patch casper-contract 5.1.1
        # Invoked through `bash` rather than `./` on purpose. The executable bit is set in git, but a
        # clone made on Windows (or with core.fileMode=false) can land without it, and `./script` then
        # dies with "Permission denied" / exit 126 — which is exactly how this job failed on 0057f14.
        run: bash prepare_patched_crate.sh
        working-directory: casper-agent/oracle-contract

      - name: Build WASM
        run: |
          RUSTFLAGS="-C link-arg=--import-undefined -C target-cpu=mvp" \
            cargo +nightly build -Z build-std=core,alloc --release --target wasm32-unknown-unknown
        working-directory: casper-agent/oracle-contract

      - name: Check artefact exists and is a sane size
        run: |
          WASM=target/wasm32-unknown-unknown/release/sequencer_oracle.wasm
          test -f "$WASM" || { echo "ERROR: $WASM not produced"; exit 1; }
          SIZE=$(stat -c%s "$WASM")
          echo "sequencer_oracle.wasm = $SIZE bytes (deployed reference: 145067)"
          # Guard against a silently empty/garbage artefact, not against exact byte equality:
          # the project path length is embedded in metadata, so CI's size differs by a few bytes.
          test "$SIZE" -gt 100000 || { echo "ERROR: artefact suspiciously small"; exit 1; }
        working-directory: casper-agent/oracle-contract

  # Added 2026-07-29, same day server.ts was first published here (it used to live only in a
  # separate private repo — SILICON_DNA_LAYERS.md cited its line numbers but no judge could open
  # it). Publishing it isn't enough on its own: this job is what stops that regressing silently,
  # the same reasoning as build-contract above. Caught two real breaks on the first run (missing
  # src/welford.ts, undeclared vite devDependency) — fixed, and this job is what would have caught
  # them in CI instead of a judge's own clone.
  check-core-server:
    name: Core Silicon DNA server.ts builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Typecheck (server.ts + src/services, src/middleware, src/db, src/utils)
        run: npx tsc --noEmit

      - name: Start smoke test — must come up and answer /metrics within 10s
        run: |
          npx tsx server.ts &
          PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/metrics > /dev/null; then
              echo "OK: server answered /metrics"
              kill $PID
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: server never answered /metrics within 10s"
          kill $PID 2>/dev/null
          exit 1

  check-sdk-and-mcp:
    name: SDK typechecks + MCP server answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: SDK — install + typecheck
        run: |
          npm install
          npx tsc --noEmit
        working-directory: casper-agent/sdk-typescript

      - name: MCP server — install + MCP handshake and tools/list
        run: |
          npm install
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | timeout 60 node index.js > out.json
          grep -q '"serverInfo"' out.json || { echo "ERROR: no initialize response"; cat out.json; exit 1; }
          grep -q 'get_sequencer_safety' out.json || { echo "ERROR: expected tool missing"; cat out.json; exit 1; }
          echo "OK: MCP server responded with its tool list"
        working-directory: casper-agent/mcp-server

      - name: Mantle pusher — syntax check
        run: node --check mantle_pusher.js
        working-directory: mantle-agent

  check-secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check no .env files committed
        run: |
          if find . -name ".env" -not -name ".env.example" | grep -q .; then
            echo "ERROR: .env file found!"
            exit 1
          fi
          echo "OK: no .env files"

      - name: Check no PEM keys committed
        run: |
          if find . -name "*.pem" | grep -q .; then
            echo "ERROR: .pem key file found!"
            exit 1
          fi
          echo "OK: no PEM keys"

  # Added 2026-08-16 with the L6 userspace sensor. The eBPF sensor needs bcc +
  # kernel headers (absent on the prod droplet), so L6 sat dead — zero events.
  # phoenix_userspace_sensor.py feeds real /proc-based exec/tcp/rtt telemetry with
  # only the stdlib; this job unit-tests its pure parsing/scoring functions so the
  # L6 layer can't silently rot again.
  test-l6-sensor:
    name: L6 userspace sensor — pure-function unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile phoenix_userspace_sensor.py
      - name: Unit tests (parse / count / diff / systemic_risk / build_events)
        run: python tests/test_phoenix_sensor.py

  # Added 2026-08-16. The L2 (TLS JA4), L0 (CPU-jitter) and P1.4 (agent identity)
  # hardening ship pure, testable modules (tlsFingerprint.ts, jitterProbe.ts,
  # agentIdentity.ts). This runs their vitest suites so fake-ja3 removal, the real
  # jitter workload, and real secp256k1 ecrecover can't regress. (Full 300+ suite
  # runs in the private core repo.)
  test-core-units:
    name: L0/L2/agent-identity core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps (@noble for agentIdentity ecrecover)
        run: npm install
      - name: vitest — jitterProbe + tlsFingerprint + agentIdentity + sealValidator + privacyPass + driftModel
        run: npx --yes vitest@2.1.9 run tests/jitterProbe.test.ts tests/tlsFingerprint.test.ts tests/agentIdentity.test.ts tests/sealValidator.test.ts tests/privacyPass.test.ts tests/driftModel.test.ts
